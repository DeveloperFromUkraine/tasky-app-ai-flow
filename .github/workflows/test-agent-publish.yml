# Test agent — the privileged half. Triggered by workflow_run, so GitHub always runs this file as it is
# on main: a pull request cannot change it. Uses no model and runs no pull-request code; it re-validates
# the unprivileged run's artifacts, then commits and reports with a short-lived GitHub App token.
# ADR-0002, ADR-0003, ADR-0004.
name: test-agent-publish

on:
  workflow_run:
    workflows: [test-agent]
    types: [completed]

permissions: {}

jobs:
  publish:
    # Evaluated before the environment (and its App key) is entered: no fork runs, nothing for runs a newer
    # push cancelled, pull requests only into main, backfill only when dispatched on main. publish.mjs
    # re-checks the same facts (plus the maintainer role) from the run, never from the artifacts.
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion != 'cancelled' && (
        (github.event.workflow_run.event == 'pull_request' && contains(github.event.workflow_run.pull_requests.*.base.ref, 'main')) ||
        (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: test-agent-publish
    concurrency:
      group: test-agent-publish-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read # download the triggering run's artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main
          persist-credentials: false
      - name: Download the run's artifacts (gate, agent, verify — whichever exist)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: art
      # Plain checkout of the analysed commit, only to apply the filtered patch to; nothing in it runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: pr
          persist-credentials: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.TEST_AGENT_APP_ID }}
          private-key: ${{ secrets.TEST_AGENT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: write
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12
      - name: Publish
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT_LOGIN: ${{ vars.TEST_AGENT_BOT_LOGIN }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_PRS: ${{ toJSON(github.event.workflow_run.pull_requests.*.number) }}
          RUN_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
        run: node main/.github/scripts/publish.mjs "$PWD/art" "$PWD/pr"
